# Included in the http block of the nginx that Elastic Beanstalk runs in front
# of the container. Its default location already forwards the Upgrade and
# Connection headers, so websockets pass through; what it does not do is wait
# longer than 60 s on a quiet one. The hub pings every 25 s, so 60 s would
# hold, but match the load balancer's idle timeout (.ebextensions/hub.config)
# rather than rely on the margin.
server_tokens off;
proxy_read_timeout 300s;
proxy_send_timeout 300s;
